<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./images/favicon.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!-- form -->

    <section class="h-100 bg-dark">
        <div class="container py-5 h-100">
            <form id="studentRegistration">
                <div class="row d-flex justify-content-center align-items-center h-100">
                    <div class="col">
                      <div class="card card-registration my-4">
                        <div class="row g-0">
                          <div class="col-xl-6 d-none d-xl-block">
                            <img src="./images/AI Picture.jpg"
                              alt="Sample photo" class="img-fluid"
                              style="border-top-left-radius: .25rem; border-bottom-left-radius: .25rem;" />
                          </div>
                          <div class="col-xl-6">
                            <div class="card-body p-md-5 text-black">
                              <h3 class="mb-5 text-uppercase">Student registration form</h3>
              
                              <div class="row">
                                <div class="col-md-6 mb-4">
                                  <div data-mdb-input-init class="form-outline">
                                    <input type="text" id="form3Example1m" class="form-control form-control-lg" name="firstname" />
                                    <label class="form-label" for="form3Example1m">First name</label>
                                  </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                  <div data-mdb-input-init class="form-outline">
                                    <input type="text" id="form3Example1n" class="form-control form-control-lg" name="lastname" />
                                    <label class="form-label" for="form3Example1n">Last name</label>
                                  </div>
                                </div>
                              </div>
              
                              
        
                              <div data-mdb-input-init class="form-outline mb-4">
                                <input type="text" id="form3Example8" class="form-control form-control-lg" name="fathername" />
                                <label class="form-label" for="form3Example8">Father's name</label>
                              </div>
              
                              <div data-mdb-input-init class="form-outline mb-4">
                                <input type="text" id="form3Example8" class="form-control form-control-lg" name="address" />
                                <label class="form-label" for="form3Example8">Address</label>
                              </div>
              
                              <div class="d-md-flex justify-content-start align-items-center mb-4 py-2">
              
                                <h6 class="mb-0 me-4">Gender: </h6>
              
                                <div class="form-check form-check-inline mb-0 me-4">
                                  <input class="form-check-input" type="radio" name="female" id="femaleGender"
                                    value="option1" />
                                  <label class="form-check-label" for="femaleGender">Female</label>
                                </div>
              
                                <div class="form-check form-check-inline mb-0 me-4">
                                  <input class="form-check-input" type="radio" name="male" id="maleGender"
                                    value="option2" />
                                  <label class="form-check-label" for="maleGender">Male</label>
                                </div>
              
                                <div class="form-check form-check-inline mb-0">
                                  <input class="form-check-input" type="radio" name="other" id="otherGender"
                                    value="option3" />
                                  <label class="form-check-label" for="otherGender">Other</label>
                                </div>
              
                              </div>
              
                              <div class="row">
                                
                                <div class="col-md-6 mb-4">
                                    <h2>
                                        Select Your City
                                    </h2>
              
                                  <select data-mdb-select-init>
                                    
                                    <option value="2">karachi</option>
                                    <option value="3">islamabad</option>
                                    <option value="4">lahore</option>
                                  </select>
              
                                </div>
                              </div>
              
                              <div data-mdb-input-init class="form-outline mb-4">
                                <input type="text" id="form3Example9" class="form-control form-control-lg" name="dob" />
                                <label class="form-label" for="form3Example9">DOB</label>
                              </div>
              
                              <div data-mdb-input-init class="form-outline mb-4">
                                <input type="text" id="form3Example90" class="form-control form-control-lg" name="course" />
                                <label class="form-label" for="form3Example90">Course</label>
                              </div>
              
                              <div data-mdb-input-init class="form-outline mb-4">
                                <input type="text" id="form3Example99" class="form-control form-control-lg" name="email" />
                                <label class="form-label" for="form3Example99">Email ID</label>
                              </div>
              
                              <div data-mdb-input-init class="form-outline mb-4">
                                <input type="text" id="form3Example97" class="form-control form-control-lg"  name="Password"/>
                                <label class="form-label" for="form3Example97">Password</label>
                              </div>
              
                              <div class="d-flex justify-content-end pt-3">
                                <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-light btn-lg">Reset all</button>
                                <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-warning btn-lg ms-2">Submit form</button>
                              </div>
              
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

            </form>
         
        </div>
      </section>

      <!-- js files -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./app.js"></script>
   
</body>
</html>
